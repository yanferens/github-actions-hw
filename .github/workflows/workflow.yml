name: CI Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello Message
        run: echo "Hello, GitHub Actions!"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          python -m pytest --cov=myapp --cov-fail-under=70 --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Add Build Step & Update Badge
        run: |
          echo "Simulating a build step..."

          if [ ! -f README.md ]; then touch README.md; fi

          if ! grep -q "badge.svg" README.md; then
            echo "Adding badge to README.md"
            sed -i '1s#^#[![CI Pipeline](https://github.com/${{ github.repository }}/actions/workflows/workflow.yml/badge.svg)](https://github.com/${{ github.repository }}/actions)\n\n#' README.md

            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add README.md
            git commit -m "docs: add build status badge [skip ci]"
            git push
          else
            echo "Badge already exists. Skipping update."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}